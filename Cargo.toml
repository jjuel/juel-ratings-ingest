[package]
name = "juel-ratings-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
reqwest = { version = "0.12.23", features = ["default-tls", "gzip", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
sqlx = { version = "0.8.6", features = ["postgres", "chrono"] }
tokio = { version = "1.47.1", features = ["full"] }
clap = { version = "4.5.49", features = ["derive"] }
